name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test
        shell: pwsh
        run: dotnet run --project tests/SpaceLens.Tests -c Release
      - name: Package
        shell: pwsh
        run: ./package.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)
      - name: Verify packaged UI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          foreach ($mode in @('startup', 'deletion', 'tasks', 'menus')) {
            $output = Join-Path $PWD "artifacts/verify-$mode"
            $app = Start-Process "artifacts/package/$version/SpaceLens.exe" -ArgumentList "--verify-$mode", ('"' + $output + '"') -WindowStyle Hidden -Wait -PassThru
            if ($app.ExitCode -ne 0 -or (Get-ChildItem $output -Filter '*failure*')) { throw "$mode verification failed" }
          }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/Releases -File | ForEach-Object FullName) --title "SpaceLens $env:GITHUB_REF_NAME" --generate-notes --verify-tag
